<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Change invoice numbers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid #FF7A1A;outline-offset:2px}
.field{width:100%;height:52px;box-sizing:border-box;padding:0 14px;border:1px solid #8795AA;border-radius:10px;background:#fff;color:#0F172A;font:700 17px 'Plus Jakarta Sans',system-ui,sans-serif}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#64748B;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#0F172A;overflow:hidden">

  <div style="position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;max-height:760px;display:flex;flex-direction:column;background:#FFFFFF;border-radius:24px 24px 0 0">

    <div style="flex:none;display:flex;justify-content:center;padding:10px 0 4px"><div style="width:44px;height:5px;border-radius:999px;background:#CBD5E1"></div></div>

    <div style="flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px 20px">
      <div style="display:flex;flex-direction:column;gap:1px">
        <div style="font-size:20px;font-weight:800;color:#0F172A">GST bill number</div>
        <div style="font-size:14px;color:#475569">How your next bill will be numbered</div>
      </div>
      <button type="button" aria-label="Close" style="width:48px;height:48px;border:0;background:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
      </button>
    </div>

    <div style="flex:1;min-height:0;overflow-y:auto;padding:4px 20px 16px;display:flex;flex-direction:column;gap:14px">

      <div style="box-sizing:border-box;padding:16px;display:flex;flex-direction:column;gap:2px;border-radius:14px;background:#FFF3E6">
        <div style="font-size:14px;font-weight:500;color:#475569">Your next bill will be</div>
        <div style="font-size:30px;font-weight:800;line-height:1.1;color:#D95F00">{{preview}}</div>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px">
        <label for="pre" style="font-size:15px;font-weight:600;color:#0F172A">Starts with</label>
        <input class="field" id="pre" type="text" value="INV-">
      </div>

      <div style="display:flex;flex-direction:column;gap:8px">
        <label for="num" style="font-size:15px;font-weight:600;color:#0F172A">Next number</label>
        <div style="display:flex;align-items:center;gap:8px">
          <button type="button" aria-label="Less" onClick="{{dec}}" style="flex:none;width:52px;height:52px;border:1px solid #8795AA;border-radius:10px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>
          </button>
          <div id="num" style="flex:1;height:52px;box-sizing:border-box;border:1px solid #8795AA;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#0F172A">{{numText}}</div>
          <button type="button" aria-label="More" onClick="{{inc}}" style="flex:none;width:52px;height:52px;border:1px solid #8795AA;border-radius:10px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          </button>
        </div>
      </div>

      <button type="button" style="height:52px;padding:0 14px;border:1px solid #E2E8F0;border-radius:14px;background:#FFFFFF;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;color:#334155;cursor:pointer">
        <span>More options</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div style="font-size:13px;color:#64748B;padding:0 4px;margin-top:-8px">Ending text, number of digits, start again every month.</div>
    </div>

    <div style="flex:none;box-sizing:border-box;padding:12px 20px 24px;background:#FFFFFF;border-top:1px solid #E2E8F0">
      <button type="button" style="width:100%;height:56px;border:0;border-radius:14px;background:#FF7A1A;color:#FFFFFF;font-size:17px;font-weight:800;cursor:pointer">Save</button>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const n = st.n === undefined ? 3 : st.n;
    const pad = (x) => String(x).padStart(3, '0');
    return {
      preview: 'INV-' + pad(n),
      numText: pad(n),
      dec: () => this.setState({ n: Math.max(1, n - 1) }),
      inc: () => this.setState({ n: n + 1 })
    };
  }
}
</script>
</body>
</html>
